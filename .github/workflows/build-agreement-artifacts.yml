name: Build agreement artifacts

on:
  push:
  workflow_dispatch:

jobs:
  build-aiwa-starisian-agreement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install document build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Build agreement artifacts
        run: bash scripts/build_agreement.sh

      - name: Upload agreement artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiwa-starisian-agreement
          path: |
            build/agreements/aiwa-starisian/*.docx
            build/agreements/aiwa-starisian/*.pdf
